name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          if [ -f tsconfig.json ]; then
            echo "tsconfig.json found — running TypeScript type check"
            npx tsc --noEmit
          else
            echo "No tsconfig.json found — skipping type check"
          fi

      - name: Lint
        run: |
          if [ -f package.json ] && grep -q "\"eslint\"" package.json; then
            echo "eslint found in package.json — running lint"
            npx eslint . --ext .js,.jsx,.ts,.tsx
          else
            echo "ESLint not configured in package.json — skipping lint"
          fi

      - name: Build (verbose)
        run: VITE_DEBUG=true npx vite build --debug

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
